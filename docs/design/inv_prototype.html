<title>Re-ERP Inventory Prototype</title>
<style>
:root{
  --brand:#C74634; --brand-dark:#A33B2C; --info:#0572CE; --ok:#1D7B4D; --warn:#B98A00; --bad:#C0392B;

  --chip:#F1EDE8; --code:#F4F1EC; --brand-soft:#FBEFEC; --info-soft:#EBF4FC; --ok-soft:#EAF4EE; --warn-soft:#FBF4E0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#191614; --panel:#221E1B; --panel2:#282824; --ink:#ECE7E1; --ink2:#A39B92; --line:#3A342E;
    --chip:#2E2925; --code:#2A2622; --brand-soft:#3A2521; --info-soft:#1E2C3A; --ok-soft:#20301F; --warn-soft:#39301C;
  }
}
:root[data-theme="dark"]{
  --ground:#191614; --panel:#221E1B; --panel2:#282824; --ink:#ECE7E1; --ink2:#A39B92; --line:#3A342E;
  --chip:#2E2925; --code:#2A2622; --brand-soft:#3A2521; --info-soft:#1E2C3A; --ok-soft:#20301F; --warn-soft:#39301C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(135deg,var(--brand),var(--brand-dark));color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px}
.top .logo{font-weight:800;font-size:16px;letter-spacing:.3px}
.top .sub{font-size:11px;opacity:.85}
.top .tag{margin-left:auto;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:2px 10px;font-size:11px}
.burger{display:none;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:4px 9px;font-size:15px;cursor:pointer}
.shell{display:flex;min-height:calc(100vh - 46px)}
nav{width:236px;flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);padding:10px 0 30px}
nav .grp{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);padding:14px 16px 4px}
nav a{display:block;padding:6px 16px 6px 22px;color:var(--ink);text-decoration:none;font-size:13px;border-left:3px solid transparent;cursor:pointer}
nav a:hover{background:var(--panel2)}
nav a.on{border-left-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
main{flex:1;min-width:0;padding:18px 22px 60px}
h1{font-size:19px;margin:0 0 2px}
.crumb{font-size:11px;color:var(--ink2);margin-bottom:10px}
.note{font-size:12px;color:var(--ink2);margin:2px 0 14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tile{flex:1 1 150px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.tile .v{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;color:var(--ink2)}
.tile.hot{border-color:var(--brand);background:var(--brand-soft)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--panel2);text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:hover td{background:var(--panel2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:10.5px;font-weight:600;background:var(--chip);color:var(--ink2);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--brand-soft);color:var(--brand)} .chip.info{background:var(--info-soft);color:var(--info)}
.btn{background:var(--brand);color:#fff;border:none;border-radius:7px;padding:7px 14px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand-dark)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.blue{background:var(--info)} .btn.grey{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.btn.sm{padding:3px 10px;font-size:11.5px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs b{padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs b.on{color:var(--brand);border-bottom-color:var(--brand)}
label{display:block;font-size:11px;color:var(--ink2);margin:0 0 3px}
input,select{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px}
.frow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.frow>div{flex:1 1 140px;min-width:120px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 18px;font-size:12.5px}
.kv b{color:var(--ink2);font-weight:500}
.acct{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px}
.acct h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.dim{color:var(--ink2)}
.modal-bg{position:fixed;inset:0;background:rgba(20,15,12,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:720px;width:100%;max-height:86vh;overflow:auto;padding:18px 20px}
.modal h3{margin:0 0 10px;font-size:15px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 18px;border-radius:99px;font-size:12.5px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.err{background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand);border-radius:8px;padding:8px 12px;font-size:12.5px;margin:8px 0}
.hint{font-size:11px;color:var(--ink2)}
.right{margin-left:auto}
@media (max-width:760px){
  .burger{display:block}
  nav{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 20px rgba(0,0,0,.2);overflow-y:auto;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  nav.open{transform:none}
  main{padding:14px 16px 60px}
}

/* ═══════════ sample master data (all figures are examples) ═══════════ */
const S = {

        iorec:'02-00-00-1310001-0000-000-00-000-000',iopay:'02-00-00-2310001-0000-000-00-000-000',
        routing:'STANDARD',rcptnum:'AUTOMATIC',nextrcpt:4,shipnum:'AUTOMATIC',nextship:1,shipmethod:'ROAD'},
  },
  subinvs:[
    {org:'W1',code:'STORES',desc:'Main stores',type:'STORAGE',asset:'Y',status:'ACTIVE'},
    {org:'W1',code:'FG',desc:'Finished goods',type:'STORAGE',asset:'Y',status:'ACTIVE'},
    {org:'W1',code:'DAMAGED',desc:'Damaged / quarantine',type:'STORAGE',asset:'Y',status:'ACTIVE',mstatus:'QUARANTINE'},
    {org:'W2',code:'STORES',desc:'Main stores',type:'STORAGE',asset:'Y',status:'ACTIVE'},
    {org:'W2',code:'FG',desc:'Finished goods',type:'STORAGE',asset:'Y',status:'ACTIVE'},
  ],
  uoms:[['EA','Each','QUANTITY'],['DOZ','Dozen','QUANTITY'],['KG','Kilogram','WEIGHT'],['G','Gram','WEIGHT'],
        ['M','Meter','LENGTH'],['L','Litre','VOLUME'],['BOX','Box','QUANTITY'],['ROLL','Roll','QUANTITY']],
  reasons:['OPENING','DAMAGE','EXPIRY','SAMPLE','CORRECTION','DONATION'],
  aliases:[{org:'W1',code:'MARKETING-SAMPLES',acct:'01-00-00-6150009-0000-000-00-000-000'},
           {org:'W1',code:'SITE-CONSUMPTION',acct:'01-00-00-6150011-0000-000-00-000-000'}],
  mstatuses:[['UNRESTRICTED','Y','Y','Y','Y'],['HOLD','Y','N','N','N'],['QUARANTINE','Y','N','Y','N'],['REJECTED','N','N','Y','N']],
  shipmethods:['ROAD','SEA','AIR','COURIER'],
  itemstatuses:['ACTIVE','PROTOTYPE','ON_HOLD','PHASE_OUT','OBSOLETE'],
  catsets:[{set:'PRODUCT',cats:['BRACKETS','FRAMES','RAW-STEEL','PACKAGING']},{set:'COST',cats:['STD-MFG','TRADED','CONSUMABLE']}],
  access:[{user:'KHALID',orgs:'ALL'},{user:'RATHEESH',orgs:'W1, W2'},{user:'STOREKEEPER1',orgs:'W1'}],
  items:[
    {n:'FG-1001',desc:'Steel Bracket 40mm',type:'FINISHED_GOOD',status:'ACTIVE',uom:'EA',lot:'Y',expctl:'Y',shelf:365,serial:'N',
     std:14.00,sell:25.50,list:12.50,taxS:'VAT5_OUT',taxP:'VAT5_IN',
     sales:'01-00-00-4110001-0000-000-00-000-000',cogs:'01-00-00-5110001-0000-000-00-000-000',exp:'01-00-00-6150001-0000-000-00-000-000',
     cat:'BRACKETS',plan:'MIN_MAX',min:50,max:500,orgs:['W1','W2']},
    {n:'FG-1002',desc:'Aluminium Frame 60cm',type:'FINISHED_GOOD',status:'ACTIVE',uom:'EA',lot:'N',expctl:'N',shelf:null,serial:'N',
     std:22.00,sell:39.00,list:19.00,taxS:'VAT5_OUT',taxP:'VAT5_IN',
     sales:'01-00-00-4110001-0000-000-00-000-000',cogs:'01-00-00-5110001-0000-000-00-000-000',exp:'01-00-00-6150001-0000-000-00-000-000',
     cat:'FRAMES',plan:'NONE',min:null,max:null,orgs:['W1','W2']},
    {n:'RM-2001',desc:'Steel Coil 2mm (per KG)',type:'RAW_MATERIAL',status:'ACTIVE',uom:'KG',lot:'N',expctl:'N',shelf:null,serial:'N',
     std:8.50,sell:null,list:7.80,taxS:'VAT5_OUT',taxP:'VAT5_IN',
     sales:'',cogs:'01-00-00-5120001-0000-000-00-000-000',exp:'01-00-00-6150001-0000-000-00-000-000',
     cat:'RAW-STEEL',plan:'MIN_MAX',min:200,max:2000,orgs:['W1']},
    {n:'CON-3001',desc:'Packing Box Large',type:'CONSUMABLE',status:'ACTIVE',uom:'EA',lot:'N',expctl:'N',shelf:null,serial:'N',
     std:1.20,sell:null,list:1.05,taxS:'EXEMPT',taxP:'VAT5_IN',
     sales:'',cogs:'',exp:'01-00-00-6150022-0000-000-00-000-000',
     cat:'PACKAGING',plan:'NONE',min:null,max:null,orgs:['W1']},
  ],
  costorg:{code:'CO-01',name:'BUIMERC Costing',method:'AVERAGE',ccy:'AED',orgs:['W1','W2']},
  costs:{'FG-1001':14.00,'FG-1002':22.00,'RM-2001':8.50,'CON-3001':1.20},
  periods:[
    {name:'Aug-26',start:'2026-08-01',end:'2026-08-31',status:'CLOSED',balances:null},
    {name:'Sep-26',start:'2026-09-01',end:'2026-09-30',status:'OPEN',balances:null},
    {name:'Oct-26',start:'2026-10-01',end:'2026-10-31',status:'NEVER_OPENED',balances:null},
  ],
  txns:[], onhand:{}, seq:5000000500,
  reservations:[{id:'R-701',org:'W1',item:'FG-1001',subinv:'STORES',qty:25,fulfilled:10,ref:'Project ALPHA',need:'2026-10-01',status:'ACTIVE'}],
  shipments:[], torders:[
    {no:'TO-000002',from:'W1',to:'W2',mode:'INTRANSIT',status:'APPROVED',need:'2026-09-28',
     lines:[{item:'FG-1001',req:20,shipped:0,received:0,srcsub:'FG',dstsub:'STORES'}]},
  ],
  ccentries:[
    {id:'CC-801',org:'W1',item:'FG-1001',subinv:'STORES',lot:'L-2026-002',snap:null,counted:null,status:'PENDING'},
    {id:'CC-802',org:'W1',item:'RM-2001',subinv:'STORES',lot:null,snap:null,counted:null,status:'PENDING'},
  ],
  abc:[['FG-1002','A',1,'46%'],['FG-1001','A',2,'31%'],['RM-2001','B',3,'19%'],['CON-3001','C',4,'4%']],
  lots:[
    {item:'FG-1001',org:'W1',lot:'L-2026-001',orig:'2026-09-05',exp:'2027-09-05'},
    {item:'FG-1001',org:'W1',lot:'L-2026-002',orig:'2026-09-05',exp:'2027-10-01'},
    {item:'FG-1001',org:'W2',lot:'L-2026-002',orig:'2026-09-14',exp:'2027-10-01'},
  ],
};
const nid=()=>'T-'+(S.seq++);
const fmt=n=>Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const P=o=>S.params[o];
const item=n=>S.items.find(i=>i.n===n);
const cost=n=>S.costs[n]??item(n).std;

/* ═══════════ engine (ported from docs/design/inv_rd_simulation.py) ═══════════ */
function ohKey(o,s,i,l){return o+'|'+s+'|'+i+'|'+(l||'-');}
function addOnhand(o,s,i,l,q){const k=ohKey(o,s,i,l);S.onhand[k]=(S.onhand[k]||0)+q;if(Math.abs(S.onhand[k])<1e-9)delete S.onhand[k];}
function onhand(o,i,s,l){let t=0;for(const k in S.onhand){const[ko,ks,ki,kl]=k.split('|');
  if(ko===o&&ki===i&&(!s||ks===s)&&(!l||kl===l))t+=S.onhand[k];}return t;}
function reservedQty(o,i,s){return S.reservations.filter(r=>r.status==='ACTIVE'&&r.org===o&&r.item===i&&(!s||!r.subinv||r.subinv===s))
  .reduce((a,r)=>a+r.qty-r.fulfilled,0);}
function att(o,i,s){return onhand(o,i,s)-reservedQty(o,i,s);}
function periodOf(date){return S.periods.find(p=>date>=p.start&&date<=p.end);}
function inTransit(){let t=0;S.shipments.filter(x=>x.status==='SHIPPED').forEach(x=>x.lines.forEach(l=>t+=l.qty));return t;}

function acctLines(type,org,itemN,qty,val,alias){
  const p=P(org), it=item(itemN);
  const off=alias?S.aliases.find(a=>a.code===alias)?.acct:null;
  switch(type){
    case 'MISC_RECEIPT': return [['DR',p.material,val],['CR',off||p.adjust,val]];
    case 'MISC_ISSUE':   return [['DR',off||it.exp||p.adjust,val],['CR',p.material,val]];
    case 'SUBINV_TRANSFER': return [];
    case 'INTERORG_SHIP': return [['DR',p.intransit,val],['CR',p.material,val]];
    case 'INTERORG_RECEIVE': return [['DR',p.material,val],['CR',p.intransit,val]];
    case 'CYCLE_COUNT_ADJ': return qty>0?[['DR',p.material,val],['CR',p.ccadj,val]]:[['DR',p.ccadj,val],['CR',p.material,val]];
  } return [];
}
function createTxn(o){
  const it=item(o.item); if(!it) throw 'Unknown item';
  const org=S.orgs.find(x=>x.code===o.org);
  if(!org||org.type!=='CHILD') throw 'Select a child organization';
  if(!it.orgs.includes(o.org)) throw `Item ${o.item} has no ACTIVE assignment in ${o.org} (409)`;
  if(!S.subinvs.find(s=>s.org===o.org&&s.code===o.subinv)) throw 'Unknown subinventory (404)';
  const pd=periodOf(o.date); if(!pd||pd.status!=='OPEN') throw `Cost period for ${o.date} is ${pd?pd.status:'missing'} - transaction rejected (409)`;
  const q=Math.abs(Number(o.qty)); if(!q) throw 'Quantity must be greater than zero (400)';
  const sign={'MISC_RECEIPT':1,'MISC_ISSUE':-1,'SUBINV_TRANSFER':-1,'INTERORG_SHIP':-1,'INTERORG_RECEIVE':1,'CYCLE_COUNT_ADJ':(o.qty>=0?1:-1)}[o.type];
  const sq=q*sign;
  if(sq<0){
    let avail=att(o.org,o.item,o.subinv);
    if(o.ref) avail+=S.reservations.filter(r=>r.status==='ACTIVE'&&r.ref===o.ref).reduce((a,r)=>a+r.qty-r.fulfilled,0);
    if(P(o.org).negok!=='Y'&&avail+1e-9<q) throw `Available to transact is ${fmt(avail)} - cannot take ${fmt(q)} (reservations protected) (409)`;
  }
  let legs=[];
  if(it.lot==='Y'){
    if(!o.lots||!o.lots.length) throw 'Item is lot controlled - lot details are required (400)';
    const s=o.lots.reduce((a,l)=>a+Number(l.q||0),0);
    if(Math.abs(s-q)>1e-9) throw `Lot quantities (${fmt(s)}) must cover the transaction quantity (${fmt(q)}) (400)`;
    legs=o.lots.map(l=>[l.lot,(sq<0?-1:1)*Math.abs(Number(l.q))]);
  } else legs=[[null,sq]];
  const c=cost(o.item), ids=[];
  legs.forEach(([lot,lq])=>{
    const val=Math.round(Math.abs(lq)*c*100)/100;
    const t={id:nid(),type:o.type,org:o.org,item:o.item,subinv:o.subinv,lot,qty:lq,cost:c,value:Math.round(lq*c*100)/100,
      date:o.date,period:pd.name,reason:o.reason||null,alias:o.alias||null,ref:o.ref||null,shipment:o.shipment||null,
      accounted:false,acct:acctLines(o.type,o.org,o.item,lq,val,o.alias)};
    S.txns.push(t); addOnhand(o.org,o.subinv,o.item,lot,lq); ids.push(t.id);
    if(o.type==='SUBINV_TRANSFER'){
      const t2={...t,id:nid(),subinv:o.tosub,qty:-lq,value:Math.round(-lq*c*100)/100,acct:[]};
      S.txns.push(t2); addOnhand(o.org,o.tosub,o.item,lot,-lq); ids.push(t2.id);
    }
  });
  if(sq<0&&o.ref){let need=q;
    S.reservations.forEach(r=>{if(r.status==='ACTIVE'&&r.ref===o.ref&&need>0){
      const take=Math.min(need,r.qty-r.fulfilled); r.fulfilled+=take; need-=take;
      if(r.fulfilled>=r.qty)r.status='FULFILLED';}});}
  return ids;
}
function createAccounting(){let n=0;S.txns.forEach(t=>{if(!t.accounted){
  const dr=t.acct.filter(a=>a[0]==='DR').reduce((a,x)=>a+x[2],0);
  const cr=t.acct.filter(a=>a[0]==='CR').reduce((a,x)=>a+x[2],0);
  if(Math.abs(dr-cr)>.005)throw 'Unbalanced entry on '+t.id; t.accounted=true;n++;}});return n;}
function closePeriod(name){
  const pd=S.periods.find(p=>p.name===name);
  const un=S.txns.filter(t=>t.period===name&&!t.accounted).length;
  if(un) throw `${un} unaccounted transaction(s) in ${name} - run Create Accounting first (409)`;
  const bal={};
  for(const k in S.onhand){const[o,s,i]=k.split('|');const kk=o+'|'+s+'|'+i;bal[kk]=(bal[kk]||0)+S.onhand[k];}
  pd.status='CLOSED';
  pd.balances=Object.entries(bal).map(([k,q])=>{const[o,s,i]=k.split('|');return{org:o,sub:s,item:i,qty:q,cost:cost(i),val:Math.round(q*cost(i)*100)/100};});
  return pd.balances;
}

/* seed transaction history (replayed so on-hand always reconciles) */
(function seed(){
  const mk=(o)=>{try{const ids=createTxn(o);ids.forEach(id=>{const t=S.txns.find(x=>x.id===id);if(o.acc)t.accounted=true;});}catch(e){console.error('seed',e);}};
  mk({type:'MISC_RECEIPT',org:'W1',item:'FG-1001',subinv:'STORES',qty:100,date:'2026-09-05',reason:'OPENING',acc:true,

    ${f.type==='MISC_ISSUE'?`<div><label>Demand reference (uses reservation)</label><input id="t_ref" value="${f.ref}" placeholder="e.g. Project ALPHA"></div>`:''}
   </div>
   ${isLot?`<div class="frow"><div><label>Lot 1</label><input id="t_l1" value="${f.l1}"></div><div><label>Qty 1</label><input id="t_q1" value="${f.q1}"></div>
   <div><label>Lot 2</label><input id="t_l2" value="${f.l2}"></div><div><label>Qty 2</label><input id="t_q2" value="${f.q2}"></div></div>
   <div class="hint">Item is lot controlled - lot quantities must cover the transaction quantity (validation 17.4).</div>`:''}
   <div class="hint" style="margin-top:4px">On-hand ${f.org}/${f.subinv}: <b>${fmt(onhand(f.org,f.item,f.subinv))}</b> &middot; reserved ${fmt(reservedQty(f.org,f.item,f.subinv))} &middot; ATT <b>${fmt(att(f.org,f.item,f.subinv))}</b> &middot; open period Sep-26</div>
   ${preview}
   <div id="t_err"></div>
   <div style="margin-top:12px"><button class="btn" data-act="dotxn">Create Transaction</button>
   <span class="hint">try: qty 999 (ATT reject) &middot; date 2026-08-15 (closed period reject) &middot; item CON-3001 in W2 (no assignment)</span></div>
  </div>`;
},
hist(){
  return `<h1>Transaction History</h1><div class="crumb">Home / Inventory / Transactions</div>
  <div class="card">${tbl(['Txn','Date','Type','Org','Item','Subinv','Lot','#Qty','#Unit cost','#Value','Reason','Accounted',''],
    S.txns.slice().reverse().map(t=>[`<span class="mono">${t.id}</span>`,t.date,t.type,t.org,t.item,t.subinv,t.lot||'-',
    '#'+fmt(t.qty),'#'+fmt(t.cost),'#'+fmt(t.value),t.reason||t.ref||'-',
    t.accounted?'<span class="chip ok">YES</span>':'<span class="chip warn">NO</span>',
    `<button class="btn grey sm" data-act="viewtxn" data-v="${t.id}">Accounting</button>`]))}</div>`;
},
acctg(){
  const un=S.txns.filter(t=>!t.accounted);
  return `<h1>Create Accounting</h1><div class="crumb">Home / Inventory / Transactions</div>
  <div class="card"><p style="margin-top:0">Groups unposted Dr/Cr lines into one GL journal batch (REFERENCE2 = transaction id, REFERENCE5 = INV_TRANSACTIONS) - same convention as AR/AP/Cash, so Check Accounting links back automatically.</p>
  ${tbl(['Txn','Date','Type','Org','#Value','Dr account','Cr account'],un.map(t=>[`<span class="mono">${t.id}</span>`,t.date,t.type,t.org,'#'+fmt(Math.abs(t.value)),
    `<span class="mono">${(t.acct.find(a=>a[0]==='DR')||['','-'])[1]}</span>`,`<span class="mono">${(t.acct.find(a=>a[0]==='CR')||['','-'])[1]}</span>`]))}
  <div style="margin-top:12px"><button class="btn" data-act="runacctg" ${un.length?'':'disabled'}>Create Accounting (${un.length})</button></div></div>`;
},
torders(){
  return `<h1>Transfer Orders</h1><div class="crumb">Home / Inventory / Transfers</div>
  <div class="card">${tbl(['TO #','From','To','Mode','Need by','Status','Lines',''],S.torders.map(t=>[
    `<b>${t.no}</b>`,t.from,t.to,t.mode,t.need,chipStatus(t.status),
    t.lines.map(l=>`${l.item}: ${l.shipped}/${l.req} shipped, ${l.received} received`).join('<br>'),
    t.status==='APPROVED'?`<button class="btn sm" data-act="shipto" data-v="${t.no}">Ship</button>`:
    t.status==='IN_PROGRESS'?'<span class="dim">awaiting receipt</span>':'-' ]))}
  <div style="margin-top:10px"><button class="btn ghost sm" data-act="savefake">+ New Transfer Order</button></div></div>
  <div class="hint">Lifecycle: DRAFT &rarr; REQUESTED &rarr; APPROVED &rarr; IN_PROGRESS &rarr; COMPLETED (RD 10.2). Ship creates an in-transit shipment; receive it on the Shipments page.</div>`;
},
ships(){
  return `<h1>Inter-Org Shipments</h1><div class="crumb">Home / Inventory / Transfers</div>
  <div class="card">${tbl(['Shipment','From','To','Mode','Date','Status','Lines',''],S.shipments.map(x=>[
    `<b>${x.no}</b>`,x.from,x.to,x.mode,x.date,chipStatus(x.status),
    x.lines.map(l=>`${l.item} x ${fmt(l.qty)}${l.lot?' ('+l.lot+')':''} &rarr; ${l.dstsub}`).join('<br>'),
    x.status==='SHIPPED'?`<button class="btn sm" data-act="receiveship" data-v="${x.no}">Receive at ${x.to}</button>`:'-']))}</div>
  <div class="hint">Accounting on ship: Dr In-transit / Cr Material (source). On receive: Dr Material / Cr In-transit (destination). In-transit units: <b>${fmt(inTransit())}</b>.</div>`;
},
cc(){
  return `<h1>Cycle Counting</h1><div class="crumb">Home / Inventory / Counting &middot; definition CC-W1-MAIN (ABC-driven, tolerance 2%)</div>
  <div class="card">${tbl(['Entry','Org','Item','Subinv','Lot','#Snapshot','Counted qty','Status',''],S.ccentries.map(e=>[
    `<span class="mono">${e.id}</span>`,e.org,e.item,e.subinv,e.lot||'-','#'+fmt(e.snap??0),
    e.status==='PENDING'?`<input style="width:90px" id="cnt_${e.id}" value="${e.counted??''}" placeholder="count">`:fmt(e.counted),
    chipStatus(e.status),
    e.status==='PENDING'?`<button class="btn sm" data-act="approvecc" data-v="${e.id}">Enter &amp; Approve</button>`:
    e.adj?`<span class="dim">adj <span class="mono">${e.adj}</span></span>`:'-']))}</div>
  <div class="hint">Approval posts a CYCLE_COUNT_ADJ through the engine: Dr/Cr Material vs Count-adjustment account, on-hand corrected (RD 11.2).</div>`;
},
pi(){
  return `<h1>Physical Inventory</h1><div class="crumb">Home / Inventory / Counting</div>
  <div class="card"><div class="kv"><b>PI</b><span><b>PI-2026-01</b> - W1 wall-to-wall</span><b>Status</b><span>${chipStatus('DRAFT')}</span>
  <b>Steps</b><span>1 Define &rarr; 2 Snapshot (freeze) &rarr; 3 Tags &rarr; 4 Counts &rarr; 5 Variances &rarr; 6 Adjust &amp; Complete</span></div>
  <div style="margin-top:10px"><button class="btn ghost sm" data-act="savefake">Take Snapshot</button></div></div>
  <div class="hint">The snapshot freezes the scope (transactions rejected while frozen) and cost periods cannot close with an open PI (validations 17.9 / 17.5).</div>`;
},
abc(){
  return `<h1>ABC Analysis</h1><div class="crumb">Home / Inventory / Counting &middot; compile ABC-W1-SEP26, criterion ONHAND_VALUE</div>
  <div class="card">${tbl(['Item','Class','#Rank','% of value'],S.abc.map(a=>[`<b>${a[0]}</b>`,
    `<span class="chip ${a[1]==='A'?'bad':a[1]==='B'?'warn':''}">${a[1]}</span>`,'#'+a[2],a[3]]))}</div>
  <div class="hint">Classes drive cycle-count frequency: A = 12 counts/year, B = 4, C = 1 (definition CC-W1-MAIN).</div>`;
},
oh(){
  const rows=Object.keys(S.onhand).sort().map(k=>{const[o,s,i,l]=k.split('|');const q=S.onhand[k];
    return [o,s,`<b>${i}</b>`,l==='-'?'-':`<span class="mono">${l}</span>`,'#'+fmt(q),'#'+fmt(att(o,i,s)),item(i).uom,'#'+fmt(q*cost(i))];});
  S.shipments.filter(x=>x.status==='SHIPPED').forEach(x=>x.lines.forEach(l=>
    rows.push([`<span class="chip info">IN-TRANSIT &rarr; ${x.to}</span>`,'-',`<b>${l.item}</b>`,l.lot?`<span class="mono">${l.lot}</span>`:'-','#'+fmt(l.qty),'#-',item(l.item).uom,'#'+fmt(l.qty*cost(l.item))])));
  return `<h1>On-Hand &amp; Availability</h1><div class="crumb">Home / Inventory / Inquiry</div>
  <div class="card">${tbl(['Org','Subinv','Item','Lot','#On-hand','#ATT','UOM','#Value AED'],rows)}</div>
  <div class="hint">ATT = on-hand minus active reservations (invariant I3). Data reconciles to the transaction ledger at every level (I1).</div>`;
},
res(){
  return `<h1>Reservations</h1><div class="crumb">Home / Inventory / Inquiry</div>
  <div class="card">${tbl(['Id','Org','Item','Subinv','#Reserved','#Fulfilled','Demand','Need by','Status',''],
    S.reservations.map(r=>[r.id,r.org,`<b>${r.item}</b>`,r.subinv||'-','#'+fmt(r.qty),'#'+fmt(r.fulfilled),r.ref,r.need,chipStatus(r.status),
    r.status==='ACTIVE'?`<button class="btn grey sm" data-act="cancelres" data-v="${r.id}">Cancel</button>`:'-']))}
  <div style="margin-top:12px" class="frow">
   <div><label>Item</label><select id="r_item">${S.items.filter(i=>i.orgs.includes('W1')).map(i=>`<option>${i.n}</option>`).join('')}</select></div>
   <div><label>Org</label><select id="r_org"><option>W1</option><option>W2</option></select></div>
   <div><label>Subinv</label><input id="r_sub" value="STORES"></div>
   <div><label>Qty</label><input id="r_qty" value="10"></div>
   <div><label>Demand reference</label><input id="r_ref" value="SO-DEMO-001"></div>
   <div style="align-self:end"><button class="btn" data-act="addres">Reserve</button></div>
  </div><div id="r_err"></div></div>
  <div class="hint">Issues quoting the demand reference consume the reservation; unrelated issues cannot touch reserved stock (validation 17.7).</div>`;
},
val(){
  const byOrg={};
  for(const k in S.onhand){const[o,s,i]=k.split('|');const v=S.onhand[k]*cost(i);byOrg[o+'|'+s]=(byOrg[o+'|'+s]||0)+v;}
  const closed=S.periods.find(p=>p.balances);
  return `<h1>Valuation</h1><div class="crumb">Home / Inventory / Inquiry &middot; cost org CO-01 (AVERAGE, AED)</div>
  <div class="card"><h4 style="margin:0 0 8px">Open period (live: on-hand x current cost)</h4>
  ${tbl(['Org','Subinventory','#Value AED'],Object.entries(byOrg).map(([k,v])=>{const[o,s]=k.split('|');return[o,s,'#'+fmt(v)];}))}</div>
  <div class="card"><h4 style="margin:0 0 8px">Closed period snapshot</h4>
  ${closed?tbl(['Period','Org','Subinv','Item','#Qty','#Value'],closed.balances.map(b=>[closed.name,b.org,b.sub,b.item,'#'+fmt(b.qty),'#'+fmt(b.val)])):
  '<span class="dim">Close Sep-26 (Cost Organizations &rarr; Cost Periods) to snapshot balances here.</span>'}</div>`;
},
};

/* ═══════════ actions ═══════════ */
document.body.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]'); if(!el)return;
  const act=el.dataset.act, v=el.dataset.v;
  const F=SUBTAB.txnf;
  try{
  if(act==='savefake') toast('Saved (prototype - wired to POST/PUT in the real build)');
  else if(act==='pickorg'){SUBTAB.org=v;render();}
  else if(act==='orgtab'){SUBTAB.orgtab=v;render();}
  else if(act==='cotab'){SUBTAB.cotab=v;render();}
  else if(act==='lk'){SUBTAB.lk=v;render();}
  else if(act==='pickitem'){SUBTAB.item=v;render();}
  else if(act==='ittab'){SUBTAB.ittab=v;render();}
  else if(act==='dotxn'){
    const g=id=>document.getElementById(id)?document.getElementById(id).value:undefined;
    Object.assign(F,{type:g('t_type'),org:g('t_org'),item:g('t_item'),subinv:g('t_sub'),tosub:g('t_tosub')||F.tosub,
      qty:g('t_qty'),date:g('t_date'),reason:g('t_reason'),alias:g('t_alias')||'',ref:g('t_ref')||'',
      l1:g('t_l1')||F.l1,q1:g('t_q1')||F.q1,l2:g('t_l2')||F.l2,q2:g('t_q2')||F.q2});
    const it=item(F.item);
    const lots=it.lot==='Y'?[{lot:F.l1,q:Number(F.q1)||0},{lot:F.l2,q:Number(F.q2)||0}].filter(l=>l.q>0):null;
    const ids=createTxn({type:F.type,org:F.org,item:F.item,subinv:F.subinv,tosub:F.tosub,qty:F.qty,date:F.date,
      reason:F.reason,alias:F.alias,ref:F.ref,lots});
    toast(`Transaction created: ${ids.join(', ')} - on-hand updated`); render();
  }
  else if(act==='viewtxn'){
    const t=S.txns.find(x=>x.id===v);
    modal(`<h3>Transaction ${t.id} - ${t.type}</h3>
     <div class="kv"><b>Org / Subinv</b><span>${t.org} / ${t.subinv}</span><b>Item</b><span>${t.item}${t.lot?' &middot; lot '+t.lot:''}</span>
     <b>Qty x Cost</b><span>${fmt(t.qty)} x ${fmt(t.cost)} = ${fmt(t.value)} AED</span><b>Date / Period</b><span>${t.date} &middot; ${t.period}</span>
     <b>Accounted</b><span>${t.accounted?'YES - GL batch (REFERENCE5 = INV_TRANSACTIONS)':'NO'}</span></div>
     <div class="acct"><h4>Accounting lines</h4>${t.acct.length?tbl(['Dr/Cr','Account','#Amount'],
       t.acct.map(l=>[l[0]==='DR'?'<b>Dr</b>':'Cr',`<span class="mono">${l[1]}</span>`,'#'+fmt(l[2])])):'<span class="dim">Net zero (subinventory transfer).</span>'}</div>
     <div style="margin-top:12px;text-align:right"><button class="btn grey" data-close>Close</button></div>`);
  }
  else if(act==='runacctg'){const n=createAccounting();toast(`${n} transactions accounted - all entries balanced (Dr = Cr)`);render();}
  else if(act==='openperiod'){S.periods.find(p=>p.name===v).status='OPEN';toast(v+' opened');render();}
  else if(act==='closeperiod'){
    const un=S.txns.filter(t=>t.period===v&&!t.accounted).length;
    const m=modal(`<h3>Close cost period ${v}</h3>
     <div class="kv"><b>Unaccounted transactions</b><span>${un?`<span class="chip bad">${un} - blocking</span>`:'<span class="chip ok">0 - ok</span>'}</span>
     <b>Open physical inventories</b><span><span class="chip ok">0 - ok</span></span>
     <b>In-transit older than period end</b><span>${inTransit()?`<span class="chip warn">${fmt(inTransit())} units - warning only</span>`:'<span class="chip ok">none</span>'}</span></div>
     <p class="hint">Close writes the valuation snapshot to period balances (RD 7.3 / 7.4).</p>
     <div style="text-align:right"><button class="btn grey" data-close>Cancel</button>
     <button class="btn" data-act="doclose" data-v="${v}" ${un?'disabled':''}>Close ${v}</button></div>`);
  }
  else if(act==='doclose'){const bal=closePeriod(v);document.querySelector('.modal-bg')?.remove();
    toast(`${v} closed - snapshot of ${bal.length} balance rows written`);SUBTAB.cotab='Period Balances';render();}
  else if(act==='showbal'){SUBTAB.cotab='Period Balances';render();}
  else if(act==='receiveship'){
    const x=S.shipments.find(s=>s.no===v);
    x.lines.forEach(l=>createTxn({type:'INTERORG_RECEIVE',org:x.to,item:l.item,subinv:l.dstsub,qty:l.qty,
      date:'2026-09-21',shipment:x.no,lots:item(l.item).lot==='Y'?[{lot:l.lot,q:l.qty}]:null}));
    x.status='RECEIVED';
    const to=S.torders.find(t=>t.status==='IN_PROGRESS'&&t.shipno===x.no);
    if(to){to.lines.forEach(l=>{const sl=x.lines.find(s=>s.item===l.item);if(sl)l.received+=sl.qty;});
      if(to.lines.every(l=>l.received>=l.req))to.status='COMPLETED';}
    toast(`${x.no} received at ${x.to} - Dr Material / Cr In-transit`);render();
  }
  else if(act==='shipto'){
    const t=S.torders.find(x=>x.no===v);
    const no='SHP-00000'+(P(t.from).nextship++);
    t.lines.forEach(l=>{createTxn({type:'INTERORG_SHIP',org:t.from,item:l.item,subinv:l.srcsub,qty:l.req,
      date:'2026-09-21',shipment:no,lots:item(l.item).lot==='Y'?[{lot:'L-2026-001',q:l.req}]:null});l.shipped=l.req;});
    S.shipments.push({no,from:t.from,to:t.to,mode:t.mode,status:'SHIPPED',date:'2026-09-21',method:'ROAD',
      lines:t.lines.map(l=>({item:l.item,qty:l.req,lot:item(l.item).lot==='Y'?'L-2026-001':null,dstsub:l.dstsub}))});
    t.status='IN_PROGRESS'; t.shipno=no;
    toast(`${t.no} shipped as ${no} - Dr In-transit / Cr Material`);render();
  }
  else if(act==='approvecc'){
    const e=S.ccentries.find(x=>x.id===v);
    const cnt=Number(document.getElementById('cnt_'+e.id).value);
    if(isNaN(cnt)||cnt<0) throw 'Enter the counted quantity (>= 0) first (400)';
    const varq=cnt-e.snap;
    if(Math.abs(varq)<1e-9){e.counted=cnt;e.status='APPROVED_ADJ';toast('No variance - entry approved');render();return;}
    const ids=createTxn({type:'CYCLE_COUNT_ADJ',org:e.org,item:e.item,subinv:e.subinv,qty:varq,date:'2026-09-21',
      lots:item(e.item).lot==='Y'?[{lot:e.lot,q:Math.abs(varq)}]:null});
    e.counted=cnt;e.status='APPROVED_ADJ';e.adj=ids[0];
    toast(`Variance ${varq>0?'+':''}${fmt(varq)} - adjustment ${ids[0]} posted`);render();
  }
  else if(act==='cancelres'){const r=S.reservations.find(x=>x.id===v);r.status='CANCELLED';toast('Reservation cancelled (fulfilled qty kept)');render();}
  else if(act==='addres'){
    const o=document.getElementById('r_org').value,i=document.getElementById('r_item').value,
          s=document.getElementById('r_sub').value,q=Number(document.getElementById('r_qty').value),
          ref=document.getElementById('r_ref').value;
    if(!item(i).orgs.includes(o)) throw `Item ${i} not assigned to ${o} (409)`;
    const a=att(o,i,s); if(q>a) throw `Cannot reserve ${fmt(q)} - available to transact is ${fmt(a)} (409)`;
    S.reservations.push({id:'R-'+(S.seq++),org:o,item:i,subinv:s,qty:q,fulfilled:0,ref,need:'2026-10-15',status:'ACTIVE'});
    toast('Reserved - ATT reduced');render();
  }
  }catch(err){
    const box=document.getElementById('t_err')||document.getElementById('r_err');
    const msg=String(err.message||err);
    if(box){box.innerHTML=`<div class="err">${msg}</div>`;}else toast(msg);
  }
});
/* live form refresh for the transaction page */
document.body.addEventListener('change',e=>{
  if(!SUBTAB.txnf)return;
  const map={t_type:'type',t_org:'org',t_item:'item',t_sub:'subinv',t_tosub:'tosub',t_qty:'qty',t_date:'date',
             t_reason:'reason',t_alias:'alias',t_ref:'ref',t_l1:'l1',t_q1:'q1',t_l2:'l2',t_q2:'q2'};
  if(map[e.target.id]!==undefined){SUBTAB.txnf[map[e.target.id]]=e.target.value;
    if(PAGE==='txn'){if(e.target.id==='t_org'){SUBTAB.txnf.subinv=S.subinvs.find(s=>s.org===SUBTAB.txnf.org).code;}render();}}
});

function render(){
  nav.innerHTML=MENU.map(([g,items])=>`<div class="grp">${g}</div>`+items.map(([id,l])=>
    `<a class="${id===PAGE?'on':''}" data-nav="${id}">${l}</a>`).join('')).join('');
  nav.querySelectorAll('[data-nav]').forEach(a=>a.addEventListener('click',()=>go(a.dataset.nav)));
  main.innerHTML=pages[PAGE]();
}
document.getElementById('burger').addEventListener('click',()=>nav.classList.toggle('open'));
render();
</script>
